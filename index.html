<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Culto de la Calabaza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="box">
    <svg viewBox="0 0 200 200" aria-hidden="true" id="bootArt"></svg>
    <h1>El Culto de la Calabaza</h1>
    <p id="bootMsg">La congregación se reúne…</p>
  </div>
</div>

<header class="menubar">
  <span class="logo"><svg viewBox="0 0 40 40" aria-hidden="true" id="logoArt"></svg>El Culto de la Calabaza</span>
  <button id="mNet">Celulares <span class="dot" id="netDot" style="margin:0 0 0 6px"></span></button>
  <button id="mTeams">Equipos</button>
  <button id="mFull">Pantalla completa</button>
  <button id="mSound">Sonido: sí</button>
  <span class="clock" id="clock"></span>
</header>

<svg class="ritual" id="ritual" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
<main class="desktop" id="desktop">
  <div class="icons" id="icons"></div>
  <p class="desk-note">Elige una carta para comenzar el ritual</p>
</main>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
